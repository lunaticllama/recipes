# Nightly: read the recipes Google Doc, rebuild the site, publish any changes.
# Also runs on demand: Actions tab > "Sync recipes" > "Run workflow".
name: Sync recipes

on:
  schedule:
    # 08:00 UTC = 3 AM Eastern in winter (EST), 4 AM in summer (EDT).
    # GitHub may start scheduled runs a little late at busy times.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      allow_drop:
        description: "Allow a big drop: publish even if the recipe count falls more than 10%"
        type: boolean
        default: false

permissions:
  contents: write   # commit and push the rebuilt site
  pages: write      # ask GitHub Pages to rebuild after the push

concurrency:
  group: sync-recipes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check for the service account key
        id: key
        env:
          KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::The GOOGLE_SERVICE_ACCOUNT_JSON secret isn't set yet, so the sync was skipped. See the README."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'

      - uses: actions/setup-python@v5
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        if: steps.key.outputs.present == 'true'
        run: pip install -r scripts/requirements.txt

      - name: Sync the doc (prints the problem report)
        if: steps.key.outputs.present == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ALLOW_DROP: ${{ inputs.allow_drop && '--allow-drop' || '' }}
        run: python scripts/sync.py $ALLOW_DROP

      - name: Run the parser tests
        if: steps.key.outputs.present == 'true'
        run: python -m unittest discover -s scripts/tests -t scripts

      - name: Build the pages
        if: steps.key.outputs.present == 'true'
        run: python scripts/build.py

      - name: Commit and push if anything changed
        if: steps.key.outputs.present == 'true'
        id: commit
        run: |
          git add -A data index.html assets/search-index.js recipes
          if git diff --cached --quiet; then
            echo "No recipe changes tonight."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync recipes from the Google Doc" -m "$(git diff --cached --stat | tail -1)"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "::notice::Pages will rebuild from the push instead."
