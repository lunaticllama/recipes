# On demand: check the recipes Google Doc for problems right away, without
# waiting for the nightly run. Only checks; it doesn't build or publish anything.
# Start it from the Actions tab > "Check recipe doc" > "Run workflow" (works on a phone).
name: Check recipe doc

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write     # keep the "Recipe doc check" issue up to date

concurrency:
  group: sync-recipes   # don't overlap with the nightly sync
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check for the service account key
        env:
          KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The GOOGLE_SERVICE_ACCOUNT_JSON secret isn't set yet, so the doc can't be read. See the README."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check the doc (prints the problem report)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/sync.py --check --report-md "$RUNNER_TEMP/doc-check.md"

      - name: Update the "Recipe doc check" issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/update_issue.sh "$RUNNER_TEMP/doc-check.md"
