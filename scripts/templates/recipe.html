<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} · Phil’s Recipes</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="icon" href="../favicon.ico" sizes="48x48">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
</head>
<body data-root="../" data-current="{{SLUG}}">
  <header class="site-header">
    <div class="container">
      <p class="site-title"><a href="../index.html">Phil’s Recipes</a></p>
      <div class="search">
        <label for="search" class="search-label">Search recipes by name or ingredient</label>
        <input id="search" class="search-input" type="search" autocomplete="off" spellcheck="false">
      </div>
    </div>
  </header>

  <section class="results container" aria-label="Search results" aria-live="polite" hidden>
    <p class="results-count"></p>
    <ul class="results-list"></ul>
  </section>

  <main class="container">
    <article class="recipe">
      <div class="recipe-head">
        <h1 class="recipe-title">{{TITLE}}</h1>
        <div class="recipe-actions">
          <button type="button" class="btn" data-action="print">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8"/><path d="M6 14h12v7H6z"/></svg>
            Print
          </button>
          <button type="button" class="btn btn-dark" data-action="wake" aria-pressed="false" hidden>Keep screen on</button>
        </div>
      </div>
{{BODY}}
    </article>
  </main>

  <script src="../assets/fuse.min.js"></script>
  <script src="../assets/search-index.js"></script>
  <script src="../assets/recipes.js"></script>
</body>
</html>
