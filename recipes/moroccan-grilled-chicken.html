<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Moroccan Grilled Chicken · Phil’s Recipes</title>
  <meta name="description" content="Phil’s recipe for Moroccan Grilled Chicken.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body data-root="../" data-current="moroccan-grilled-chicken">
  <header class="site-header">
    <div class="container">
      <p class="site-title"><a href="../index.html">Phil’s Recipes</a></p>
      <div class="search">
        <label for="search" class="search-label">Search recipes by name or ingredient</label>
        <input id="search" class="search-input" type="search" autocomplete="off" spellcheck="false">
      </div>
    </div>
  </header>

  <section class="results container" aria-label="Search results" aria-live="polite" hidden>
    <p class="results-count"></p>
    <ul class="results-list"></ul>
  </section>

  <main class="container">
    <article class="recipe">
      <div class="recipe-head">
        <h1 class="recipe-title">Moroccan Grilled Chicken</h1>
        <div class="recipe-actions">
          <button type="button" class="btn" data-action="print">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8"/><path d="M6 14h12v7H6z"/></svg>
            Print
          </button>
          <button type="button" class="btn btn-dark" data-action="wake" aria-pressed="false" hidden>Keep screen on</button>
        </div>
      </div>
    <section class="recipe-section">
      <div class="recipe-body">
        <section class="ingredients">
          <h3 class="section-title">Ingredients</h3>
          <div class="ingredient-group">
            <div class="check"><input id="ing-1" type="checkbox"><label for="ing-1">1½ to 1¾ pounds boneless skinless chicken breasts (or chicken tenderloins)</label></div>
            <div class="check"><input id="ing-2" type="checkbox"><label for="ing-2">¼ cup extra virgin olive oil</label></div>
            <div class="check"><input id="ing-3" type="checkbox"><label for="ing-3">1 teaspoon salt</label></div>
            <div class="check"><input id="ing-4" type="checkbox"><label for="ing-4">1 teaspoon sugar</label></div>
            <div class="check"><input id="ing-5" type="checkbox"><label for="ing-5">3 garlic cloves, minced</label></div>
            <div class="check"><input id="ing-6" type="checkbox"><label for="ing-6">2 teaspoons paprika</label></div>
            <div class="check"><input id="ing-7" type="checkbox"><label for="ing-7">1 teaspoon ground cumin</label></div>
            <div class="check"><input id="ing-8" type="checkbox"><label for="ing-8">½ teaspoon ground coriander</label></div>
            <div class="check"><input id="ing-9" type="checkbox"><label for="ing-9">¼ teaspoon ground ginger</label></div>
            <div class="check"><input id="ing-10" type="checkbox"><label for="ing-10">¼ teaspoon ground turmeric</label></div>
            <div class="check"><input id="ing-11" type="checkbox"><label for="ing-11">¼ teaspoon ground cinnamon</label></div>
            <div class="check"><input id="ing-12" type="checkbox"><label for="ing-12">⅛ teaspoon cayenne pepper</label></div>
          </div>
        </section>
        <section class="directions">
          <h3 class="section-title">Directions</h3>
          <ol class="steps">
            <li><div class="step-text"><p>Pound out chicken breasts to even thickness, marinate 5-6 hours with the rest of the ingredients, and grill.</p></div></li>
          </ol>
        </section>
      </div>
    </section>
    </article>
  </main>

  <script src="../assets/fuse.min.js"></script>
