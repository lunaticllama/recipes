<body data-root="../" data-current="chili-oil">
  <header class="site-header">
    <div class="container">
      <p class="site-title"><a href="../index.html">Phil’s Recipes</a></p>
      <div class="search">
        <label for="search" class="search-label">Search recipes by name or ingredient</label>
        <input id="search" class="search-input" type="search" autocomplete="off" spellcheck="false">

  <section class="results container" aria-label="Search results" aria-live="polite" hidden>
    <p class="results-count"></p>

  <main class="container">
    <article class="recipe">
      <div class="recipe-head">
        <h1 class="recipe-title">Chili Oil</h1>
        <div class="recipe-actions">
          <button type="button" class="btn" data-action="print">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8"/><path d="M6 14h12v7H6z"/></svg>
            Print
          </button>
          <button type="button" class="btn btn-dark" data-action="wake" aria-pressed="false" hidden>Keep screen on</button>
        </div>
      </div>
    <section class="recipe-section">
      <div class="recipe-body">
        <section class="ingredients">
          <h3 class="section-title">Ingredients</h3>
          <div class="ingredient-group">
            <div class="check"><input id="ing-1" type="checkbox"><label for="ing-1">1 cup chili flakes or more</label></div>
            <div class="check"><input id="ing-2" type="checkbox"><label for="ing-2">1 clove garlic, minced</label></div>
            <div class="check"><input id="ing-3" type="checkbox"><label for="ing-3">1 small shallot, minced</label></div>
            <div class="check"><input id="ing-4" type="checkbox"><label for="ing-4">1 tsp sugar</label></div>
            <div class="check"><input id="ing-5" type="checkbox"><label for="ing-5">1 tbs light soy sauce</label></div>
            <div class="check"><input id="ing-6" type="checkbox"><label for="ing-6">1 tsp sesame oil</label></div>
            <div class="check"><input id="ing-7" type="checkbox"><label for="ing-7">¼ tsp MSG</label></div>
            <div class="check"><input id="ing-8" type="checkbox"><label for="ing-8">1 - 2 cups of neutral oil</label></div>
          </div>
        </section>
        <section class="directions">
          <h3 class="section-title">Directions</h3>
          <ol class="steps">
            <li><div class="step-text"><p>Fry garlic, shallot, and chili flakes in oil for 5 minutes or until fragrant and chili flakes are browning. Watch out, the chili may burn your eyes!</p></div></li>
            <li><div class="step-text"><p>Pour into mason jar and mix in other ingredients.</p></div></li>
          </ol>
        </section>
      </div>
